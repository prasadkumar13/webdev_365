<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pricing Cards</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h1 class="title">Choose Your Plan</h1>
    <div class="container">
        <div class="card">
            <h2>Basic</h2>
            <h3>$499 / month</h3>
            <p>Html</p>
            <p>CSS</p>
            <p>Email Support</p>
            <button>Buy Now</button>
        </div>

        <div class="card pro">
            <h2>Pro</h2>
            <h3>$999/month</h3>
            <p>HTML</p>
            <p>CSS</p>
            <p>JavaScript</p>
            <p>Priority Support</p>
            <button>Buy Now</button>

        </div>
        <div class="card">
            <h2>Enterprise</h2>
            <h3>$1999/month</h3>
            <p>HTML</p>
            <p>CSS</p>
            <p>JavaScript</p>
            <p>Dedicated Support</p>
            <button>Buy Now</button>
        </div>


    </div>
</body>
</html>
